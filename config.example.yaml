models:
  primary:
    apiBaseUrl: "https://api.openai.com/v1"
    apiKey: ""
    model: "gpt-5.4"
    apiFormat: "responses" # openai-chat | responses | anthropic-messages
    timeoutSec: 120 # complete non-streaming request timeout
    maxImagesAllowed: 100
    # Extra provider-native request fields are shallow-merged at the wire boundary.
    # extraBody:
    #   reasoning:
    #     effort: "high"
    #     summary: "auto"

  probe:
    apiBaseUrl: "https://api.anthropic.com/v1"
    apiKey: ""
    model: "claude-haiku-4-5"
    apiFormat: "anthropic-messages"
    timeoutSec: 60
    maxImagesAllowed: 10

telegram:
  botToken: ""
  apiId: 0
  apiHash: ""
  userbotEnabled: false
  # botDataDir: "data/tdlib-bot"
  # userbotDataDir: "data/tdlib-userbot"

database:
  path: "./data/cahciua.db"

runtime:
  shell: ["/bin/bash", "-c"]
  writeFile: ["/bin/bash", "-c", "/usr/bin/cat > \"$0\""]
  readFile: ["/usr/bin/cat"]
  writeFileSizeLimit: 20971520
  readFileSizeLimit: 20971520

backgroundTasks:
  outputDir: "./data/task-outputs"
  retentionCount: 20

# Every key other than "default" is a resident chat ID. Per-chat objects are
# deep-merged over default; unconfigured chats are archived but never projected.
chats:
  default:
    primary:
      model: "primary"
    probe:
      # Probe is mandatory. Omit model to reuse the primary endpoint.
      model: "probe"
    systemFiles:
      - "prompts/IDENTITY.md"
    sendTypingAction: true
    blockedUserIds: []

    debounce:
      initialDelayMs: 1000
      typingExtendMs: 5000
      maxDelayMs: 30000

    compaction:
      maxContextEstTokens: 200000
      workingWindowEstTokens: 8000
      # model: "primary"

    imageToText:
      enabled: false
      model: "primary"
      maxConcurrency: 3

    animationToText:
      enabled: false
      model: "primary"
      maxFrames: 5
      maxConcurrency: 3

    customEmojiToText:
      enabled: false
      model: "primary"
      maxFrames: 5
      maxConcurrency: 3

    tools:
      bash:
        backgroundThresholdSec: 10
      web:
        providers:
          tavily: { apiKey: "" }
          microsoftGrounding: { apiKey: "" }
          jina: { apiKey: "" }
          exa: { apiKey: "" }
        # search: "tavily" # tavily | microsoft-grounding | jina | exa
        # fetch: "jina"

  # Replace with a Telegram chat ID to enable residency and Driver processing.
  "-1000000000000": {}
